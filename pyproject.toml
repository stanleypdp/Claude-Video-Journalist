[project]
name = "vjournalist"
version = "0.1.0"
description = "Turn short videos into evidence-backed Markdown knowledge for Claude agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema>=4.23,<5", "Pillow>=11,<13", "PyYAML>=6,<7", "python-dotenv>=1,<2",
  "scenedetect>=0.6.7,<0.7", "opencv-python>=4.11,<5", "faster-whisper>=1.1,<2", "numpy>=2,<3",
  "rapidocr-onnxruntime>=1.4,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
