name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tests (no Whisper, no network, no Claude login: ASR/OCR are mocked)
        run: uv run pytest -q
      - name: Pre-push scan
        run: ./scripts/prepush_scan.sh
